name: Release Mobile APK

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'packages/types/**'
      - '.github/workflows/mobile-release.yml'
      - 'scripts/bump-mobile-version.mjs'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: 'Explicit version (e.g. 1.2.0 - overrides bump type)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all Git tags
        run: git fetch --tags --force

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute Next Version & Release Notes
        id: version
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          BUMP_ARGS="--github-output --sync-package"
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            BUMP_ARGS="$BUMP_ARGS --custom ${{ github.event.inputs.custom_version }}"
          elif [ -n "${{ github.event.inputs.bump_type }}" ]; then
            BUMP_ARGS="$BUMP_ARGS --type ${{ github.event.inputs.bump_type }}"
          fi
          node scripts/bump-mobile-version.mjs $BUMP_ARGS

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Keystore Signing
        id: keystore
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Production keystore secret detected. Decoding keystore..."
            KEYSTORE_FILE="${{ github.workspace }}/release.keystore"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Using default repository debug keystore for release build."
          fi

      - name: Build Android Release APK
        shell: bash
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}" \
            --no-daemon --stacktrace

      - name: Prepare Release Artifacts
        id: artifacts
        shell: bash
        run: |
          APK_SOURCE="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            APK_SOURCE=$(find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          
          if [ ! -f "$APK_SOURCE" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi

          FINAL_APK="aetheroll-mobile-${{ steps.version.outputs.tag }}.apk"
          LATEST_APK="aetheroll-mobile-latest.apk"
          cp "$APK_SOURCE" "$FINAL_APK"
          cp "$APK_SOURCE" "$LATEST_APK"
          sha256sum "$FINAL_APK" > "${FINAL_APK}.sha256"
          sha256sum "$LATEST_APK" > "${LATEST_APK}.sha256"

          echo "apk_path=$FINAL_APK" >> $GITHUB_OUTPUT
          echo "sha_path=${FINAL_APK}.sha256" >> $GITHUB_OUTPUT
          echo "latest_apk_path=$LATEST_APK" >> $GITHUB_OUTPUT
          echo "latest_sha_path=${LATEST_APK}.sha256" >> $GITHUB_OUTPUT
          echo "Built APK: $FINAL_APK and $LATEST_APK"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheroll-mobile-${{ steps.version.outputs.tag }}
          path: |
            ${{ steps.artifacts.outputs.apk_path }}
            ${{ steps.artifacts.outputs.sha_path }}
            ${{ steps.artifacts.outputs.latest_apk_path }}
            ${{ steps.artifacts.outputs.latest_sha_path }}
          retention-days: 14

      - name: Create Git Tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Aetheroll Mobile ${{ steps.version.outputs.tag }}"
          body: |
            ## Aetheroll Mobile ${{ steps.version.outputs.tag }} 🚀

            ### What's Changed
            ${{ steps.version.outputs.release_notes }}

            ---
            **Release Details**:
            - **Version Name**: `${{ steps.version.outputs.version }}`
            - **Version Code**: `${{ steps.version.outputs.version_code }}`
            - **Commit**: `${{ github.sha }}`
          files: |
            ${{ steps.artifacts.outputs.apk_path }}
            ${{ steps.artifacts.outputs.sha_path }}
            ${{ steps.artifacts.outputs.latest_apk_path }}
            ${{ steps.artifacts.outputs.latest_sha_path }}
          draft: false
          prerelease: false
