name: Release Mobile APK

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'packages/types/**'
      - '.github/workflows/mobile-release.yml'
      - 'scripts/bump-mobile-version.mjs'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: 'Explicit version (e.g. 1.2.0 - overrides bump type)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      release_notes: ${{ steps.version.outputs.release_notes }}
      apk_path: ${{ steps.artifacts.outputs.apk_path }}
      sha_path: ${{ steps.artifacts.outputs.sha_path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all Git tags
        run: git fetch --tags --force

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute Next Version & Release Notes
        id: version
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          BUMP_ARGS="--github-output --sync-package"
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            BUMP_ARGS="$BUMP_ARGS --custom ${{ github.event.inputs.custom_version }}"
          elif [ -n "${{ github.event.inputs.bump_type }}" ]; then
            BUMP_ARGS="$BUMP_ARGS --type ${{ github.event.inputs.bump_type }}"
          fi
          node scripts/bump-mobile-version.mjs $BUMP_ARGS

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Keystore Signing
        id: keystore
        shell: bash
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || \
             [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "Error: production Android signing secrets are required for a release build."
            exit 1
          fi

          KEYSTORE_FILE="${{ github.workspace }}/release.keystore"
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Configure Production API URL
        shell: bash
        env:
          LIVE_API_URL: ${{ secrets.MOBILE_API_URL || vars.MOBILE_API_URL || 'https://aetheroll-api.builtbyshiva.com' }}
        run: |
          node -e "
            const fs = require('fs');
            const url = process.env.LIVE_API_URL || 'https://aetheroll-api.builtbyshiva.com';
            fs.writeFileSync('apps/mobile/src/config/env.json', JSON.stringify({ API_URL: url }, null, 2));
            console.log('[CI] Configured Mobile API_URL to:', url);
          "

      - name: Build Android Release APK
        shell: bash
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}" \
            --no-daemon --stacktrace

      - name: Prepare Release Artifacts
        id: artifacts
        shell: bash
        run: |
          APK_SOURCE="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            APK_SOURCE=$(find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          
          if [ ! -f "$APK_SOURCE" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi

          FINAL_APK="aetheroll-mobile-${{ steps.version.outputs.tag }}.apk"
          LATEST_APK="aetheroll-mobile-latest.apk"
          cp "$APK_SOURCE" "$FINAL_APK"
          cp "$APK_SOURCE" "$LATEST_APK"
          sha256sum "$FINAL_APK" > "${FINAL_APK}.sha256"
          sha256sum "$LATEST_APK" > "${LATEST_APK}.sha256"

          echo "apk_path=$FINAL_APK" >> $GITHUB_OUTPUT
          echo "sha_path=${FINAL_APK}.sha256" >> $GITHUB_OUTPUT
          echo "latest_apk_path=$LATEST_APK" >> $GITHUB_OUTPUT
          echo "latest_sha_path=${LATEST_APK}.sha256" >> $GITHUB_OUTPUT
          echo "Built APK: $FINAL_APK and $LATEST_APK"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheroll-mobile-${{ steps.version.outputs.tag }}
          path: |
            ${{ steps.artifacts.outputs.apk_path }}
            ${{ steps.artifacts.outputs.sha_path }}
            ${{ steps.artifacts.outputs.latest_apk_path }}
            ${{ steps.artifacts.outputs.latest_sha_path }}
          retention-days: 14

      - name: Create Git Tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_NOTES: ${{ steps.version.outputs.release_notes }}
          APK_PATH: ${{ steps.artifacts.outputs.apk_path }}
          SHA_PATH: ${{ steps.artifacts.outputs.sha_path }}
        run: |
          RELEASE_BODY=$(cat <<EOF
          ## Aetheroll Mobile ${RELEASE_TAG} 🚀

          ### What's Changed
          ${RELEASE_NOTES}

          ---
          **Release Details**:
          - **Version Name**: \`${RELEASE_VERSION}\`
          - **Version Code**: \`${RELEASE_VERSION_CODE}\`
          - **Commit**: \`${GITHUB_SHA}\`
          EOF
          )

          FULL_APK_PATH="$GITHUB_WORKSPACE/${APK_PATH}"
          FULL_SHA_PATH="$GITHUB_WORKSPACE/${SHA_PATH}"

          gh release create "${RELEASE_TAG}" \
            "${FULL_APK_PATH}" \
            "${FULL_SHA_PATH}" \
            --target "${GITHUB_SHA}" \
            --title "Aetheroll Mobile ${RELEASE_TAG}" \
            --notes "${RELEASE_BODY}" || \
          gh release upload "${RELEASE_TAG}" "${FULL_APK_PATH}" "${FULL_SHA_PATH}" --clobber

  publish-r2:
    name: Publish Release to Cloudflare R2
    needs: build-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download APK from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ needs.build-and-release.outputs.tag }}" \
            --pattern "aetheroll-mobile-*.apk*" \
            --dir .

      - name: Publish APK and update manifest to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_VERSION: ${{ needs.build-and-release.outputs.version }}
          RELEASE_VERSION_CODE: ${{ needs.build-and-release.outputs.version_code }}
          RELEASE_TAG: ${{ needs.build-and-release.outputs.tag }}
          RELEASE_NOTES: ${{ needs.build-and-release.outputs.release_notes }}
          APK_PATH: ${{ needs.build-and-release.outputs.apk_path }}
          SHA_PATH: ${{ needs.build-and-release.outputs.sha_path }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare R2 credentials (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) not configured. Skipping R2 publish."
            exit 0
          fi

          FULL_APK_PATH="$GITHUB_WORKSPACE/$APK_PATH"
          FULL_SHA_PATH="$GITHUB_WORKSPACE/$SHA_PATH"
          FULL_MANIFEST_PATH="$GITHUB_WORKSPACE/android-latest.json"

          APK_KEY="android/releases/${RELEASE_TAG}/aetheroll-${RELEASE_VERSION}.apk"
          APK_SIZE=$(wc -c < "$FULL_APK_PATH" | tr -d ' ')
          APK_SHA256=$(cut -d ' ' -f 1 "$FULL_SHA_PATH")
          export APK_KEY APK_SIZE APK_SHA256 FULL_MANIFEST_PATH
          node -e '
            const fs = require("fs");
            const notes = (process.env.RELEASE_NOTES || "").split("\\n").filter(Boolean);
            const manifest = {
              version: process.env.RELEASE_VERSION,
              versionCode: Number(process.env.RELEASE_VERSION_CODE || process.env.GITHUB_RUN_NUMBER),
              publishedAt: new Date().toISOString(),
              sha256: process.env.APK_SHA256,
              sizeBytes: Number(process.env.APK_SIZE),
              releaseNotes: notes,
              apkKey: process.env.APK_KEY,
            };
            fs.writeFileSync(process.env.FULL_MANIFEST_PATH, JSON.stringify(manifest, null, 2));
          '
          pnpm --filter @aetheroll/api exec wrangler r2 object put "aetheroll-releases/$APK_KEY" --file "$FULL_APK_PATH" --content-type application/vnd.android.package-archive --cache-control "public, max-age=31536000, immutable"
          pnpm --filter @aetheroll/api exec wrangler r2 object put "aetheroll-releases/android/latest.json" --file "$FULL_MANIFEST_PATH" --content-type application/json --cache-control "public, max-age=60, stale-while-revalidate=300"
