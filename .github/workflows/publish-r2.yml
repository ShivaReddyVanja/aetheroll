name: Sync Release to Cloudflare R2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'GitHub Release Tag to sync (e.g. v1.7.0)'
        required: true
        type: string
        default: 'v1.7.0'

permissions:
  contents: read

jobs:
  publish-r2:
    name: Sync Existing Release to R2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download APK from GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          echo "Downloading release assets for ${TAG}..."
          gh release download "${TAG}" --pattern "aetheroll-mobile-*.apk*" --dir .

          APK_FILE=$(ls aetheroll-mobile-*.apk | grep -v "\.sha256$" | head -n 1)
          SHA_FILE=$(ls aetheroll-mobile-*.apk.sha256 | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found in GitHub release ${TAG}."
            exit 1
          fi

          VERSION=$(echo "${TAG}" | sed 's/^v//')
          echo "apk_path=${APK_FILE}" >> $GITHUB_OUTPUT
          echo "sha_path=${SHA_FILE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Publish APK and update manifest to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          APK_PATH: ${{ steps.release.outputs.apk_path }}
          SHA_PATH: ${{ steps.release.outputs.sha_path }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Error: Cloudflare R2 credentials (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) are not configured."
            exit 1
          fi

          FULL_APK_PATH="$GITHUB_WORKSPACE/$APK_PATH"
          FULL_SHA_PATH="$GITHUB_WORKSPACE/$SHA_PATH"
          FULL_MANIFEST_PATH="$GITHUB_WORKSPACE/android-latest.json"

          APK_KEY="android/releases/${RELEASE_TAG}/aetheroll-${RELEASE_VERSION}.apk"
          APK_SIZE=$(wc -c < "$FULL_APK_PATH" | tr -d ' ')
          APK_SHA256=$(cut -d ' ' -f 1 "$FULL_SHA_PATH")
          export APK_KEY APK_SIZE APK_SHA256 FULL_MANIFEST_PATH
          node -e '
            const fs = require("fs");
            const manifest = {
              version: process.env.RELEASE_VERSION,
              versionCode: Number(process.env.GITHUB_RUN_NUMBER),
              publishedAt: new Date().toISOString(),
              sha256: process.env.APK_SHA256,
              sizeBytes: Number(process.env.APK_SIZE),
              releaseNotes: [`Release ${process.env.RELEASE_TAG}`],
              apkKey: process.env.APK_KEY,
            };
            fs.writeFileSync(process.env.FULL_MANIFEST_PATH, JSON.stringify(manifest, null, 2));
          '
          pnpm --filter @aetheroll/api exec wrangler r2 object put "aetheroll-releases/$APK_KEY" --file "$FULL_APK_PATH" --content-type application/vnd.android.package-archive --cache-control "public, max-age=31536000, immutable"
          pnpm --filter @aetheroll/api exec wrangler r2 object put "aetheroll-releases/android/latest.json" --file "$FULL_MANIFEST_PATH" --content-type application/json --cache-control "public, max-age=60, stale-while-revalidate=300"
